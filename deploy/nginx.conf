# Ferum Board — reverse proxy.
#
# The application terminates no TLS and runs plain HTTP on port 5173. This file is
# mounted read-only into the `nginx` service by docker-compose.prod.yml.
#
# The certificate is a Cloudflare Origin Certificate placed at
# /opt/ferum/certs/ on the host — see docs/deployment.md.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # The app compresses its own responses (gzip + brotli, applied to /static and
    # /themes as well), so nginx does not gzip again. Passing the upstream's
    # Content-Encoding straight through is both correct and cheaper.
    gzip off;

    # Must exceed the largest legitimate upload. The app's own ceiling is the
    # plugin package limit (50 MB) plus multipart overhead; a smaller value here
    # fails the upload at the proxy with a 413 before the app sees it.
    client_max_body_size 55m;

    # Matches NF-SC-05: 10 requests/minute on the auth endpoints. `burst=5` lets a
    # legitimate retry through instead of rejecting it outright.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ─── Guest page cache ────────────────────────────────────────────────────
    # The caching table in CLAUDE.md assigns the 30s guest SSR cache to
    # "Nginx/CDN … configured at edge". Without a CDN in front, that layer
    # exists nowhere, and 70% of the audience are logged-out readers all being
    # served identical HTML rendered from scratch every time.
    #
    # Mounted on tmpfs by docker-compose.prod.yml — see the note there.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=guest:10m
                     max_size=160m inactive=7d use_temp_path=off;

    # A response is cacheable only for anonymous readers. `token` is the access
    # cookie set by ferum-web/src/utils.rs (Path=/); its presence means the page
    # carries per-user chrome — the notification bell, the user dropdown, and
    # every authorization decision behind them. Serving one reader's page to
    # another is the failure this single check prevents.
    #
    # refresh_token is scoped to /api/auth and never reaches these locations, so
    # matching on `token` alone is sufficient and not an oversight.
    map $http_cookie $ferum_no_cache {
        default 0;
        "~*(^|;\s*)token="  1;
    }

    upstream ferum_app {
        server app:5173;
    }

    # ─── Cloudflare real client IP ───────────────────────────────────────────
    # Behind Cloudflare's proxy, every connection arrives from a Cloudflare edge
    # address. Rewriting $remote_addr from CF-Connecting-IP is what restores the
    # real client — and it is only honoured for connections originating in the
    # ranges below, so the header cannot be forged by anyone reaching the origin
    # directly.
    #
    # Keep this list current from https://www.cloudflare.com/ips/. A range added
    # by Cloudflare and missing here does not fail loudly: those users simply get
    # rate-limited as one shared bucket.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ─── Shared proxy headers ────────────────────────────────────────────────
    # X-Forwarded-For is what the app's per-IP rate limiter reads, and only when
    # TRUSTED_PROXY_COUNT is set to the number of proxies in front of it. With
    # this file that number is 1. Leave it at 0 and every client is rate-limited
    # as if it were this proxy.
    #
    # $remote_addr, NOT $proxy_add_x_forwarded_for. The appending form builds a
    # chain, and behind Cloudflare that chain is `<client>, <cf-edge>` — two
    # entries. extract_client_ip() takes the (N)th-from-last with N=1, i.e. the
    # Cloudflare edge, so every visitor on earth would share one rate-limit
    # bucket. Setting TRUSTED_PROXY_COUNT=2 instead would also "work" until a
    # client arrives with an X-Forwarded-For of its own, which shifts the index
    # again and is attacker-controlled.
    #
    # Overwriting with the real_ip-corrected $remote_addr keeps the header at
    # exactly one entry that nginx itself established, so TRUSTED_PROXY_COUNT=1
    # is correct with or without Cloudflare in front.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # `_` is nginx's "match anything", and it is deliberate rather than lazy:
    # this box serves exactly one site, and Cloudflare will only forward requests
    # for hostnames configured in the zone. Naming the domain here would add a
    # second place to edit per installation without adding a check that anything
    # else is not already performing.
    #
    # Run more than one site on this VM and this has to become a real
    # `server_name`, one server block per host.
    server {
        listen 80;
        server_name _;

        # ACME HTTP-01 challenges must not be redirected.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Cloudflare Origin Certificate — issued from the dashboard under
        # SSL/TLS → Origin Server, valid 15 years, and trusted by Cloudflare in
        # Full (strict) mode. It is NOT trusted by browsers, which is fine and
        # is the point: nothing but Cloudflare should be reaching this port.
        #
        # This replaces certbot for a proxied domain. The ACME HTTP-01 challenge
        # cannot complete while Cloudflare is proxying port 80 anyway. Switch
        # back to /etc/letsencrypt/... only if you ever go grey-cloud (DNS-only).
        ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
        ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # HSTS is set here rather than in the application, which cannot know
        # whether it is being served over TLS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://ferum_app;
        }

        # Server-Sent Events. Buffering must be off or notifications arrive in
        # batches when nginx's buffer happens to fill; the app sends a keep-alive
        # every 25s, so the read timeout has to outlast that.
        location /api/notifications/stream {
            proxy_pass http://ferum_app;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # CAS blobs: avatars, covers, thumbnails, post attachments. The key is a
        # SHA-256 of the content, so the bytes behind a URL never change and a
        # long TTL is safe.
        #
        # This is the location the measurement in CLAUDE.md was taken against:
        # 120 concurrent requests for one 1.95 MB image took page rendering from
        # ~20ms to ~800ms, and the number did not move with pool size or the
        # blob-read cap. Caching here is what keeps that traffic off the app.
        #
        # $ferum_no_cache still applies: a staged attachment (ref_count = 0) is
        # authorized per viewer and must never be served from a shared cache.
        location /files/ {
            proxy_pass http://ferum_app;
            proxy_cache        guest;
            proxy_cache_key    "$scheme$host$request_uri";
            proxy_cache_valid  200 7d;
            proxy_cache_valid  404 1m;
            proxy_cache_bypass $ferum_no_cache;
            proxy_no_cache     $ferum_no_cache;
            # One request fetches a cold entry; the rest wait for it rather than
            # all stampeding the app for the same 2 MB image.
            proxy_cache_lock   on;
            proxy_cache_use_stale error timeout updating;
            # HSTS is REPEATED here, not inherited. nginx applies add_header from
            # an outer level only when the current level declares none of its own,
            # so adding X-Cache-Status silently drops the server-level HSTS for
            # this location — and NF-SC-01 requires it. Nothing warns about this;
            # the header simply stops appearing. Any future add_header in a
            # location must carry HSTS with it.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            proxy_pass http://ferum_app;
            proxy_cache        guest;
            # ferum_locale MUST be in the key. The app renders per-locale Tera
            # instances from one URL, so omitting it lets the first Vietnamese
            # reader poison the entry for every English one, and vice versa.
            proxy_cache_key    "$scheme$host$request_uri$cookie_ferum_locale";
            proxy_cache_valid  200 30s;
            proxy_cache_bypass $ferum_no_cache;
            proxy_no_cache     $ferum_no_cache;
            proxy_cache_lock   on;
            # Serve a stale page rather than an error page while the app is
            # restarting — a deploy becomes invisible to logged-out readers.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            # Repeated for the same reason as in /files/ above.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
