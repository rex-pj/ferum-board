# Ferum Board — production stack.
#
#   cp backend/.env.example .env.prod   # then edit; see README "Deployment"
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# `--env-file` is REQUIRED: `env_file:` only feeds variables INTO a container,
# while the `${...}` below are resolved by Compose itself. Omit it and
# DB_PASSWORD expands to empty, so Postgres refuses to start.
#
# Must be present in .env.prod: APP_IMAGE, DB_PASSWORD, and the R2_* set (see
# `app.environment` below). Service addresses live in `environment:` instead,
# which wins over `env_file:`. Nothing here names a domain or registry.

services:
  app:
    # Built in CI, NOT here: the e2-medium cannot finish a fat-LTO build (rustc
    # peaks at 4-8 GB against 4 GB of RAM).
    #
    # APP_IMAGE is the untagged registry path, in .env.prod so this file stays
    # installation-agnostic. IMAGE_TAG is the commit SHA — pin it to roll back.
    image: ${APP_IMAGE:?set APP_IMAGE in .env.prod}:${IMAGE_TAG:-latest}
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://forum:${DB_PASSWORD}@postgres:5432/forum
      REDIS_URL: redis://redis:6379
      # Object storage is Cloudflare R2, configured entirely from .env.prod
      # (R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY / R2_SECRET_KEY /
      # R2_PUBLIC_BASE_URL) — nothing here, because none of it is a service
      # address. The image MUST be built with `--features r2`, else those
      # variables are ignored and every upload lands in PostgreSQL instead.
      #
      # To go back to the self-hosted MinIO below, uncomment these four AND the
      # minio/minio-init services — R2 wins the precedence (R2 > GCS > S3 > db),
      # so leaving both configured silently ignores these.
      # S3_ENDPOINT: http://minio:9000
      # S3_BUCKET: ${S3_BUCKET:-forum-uploads}
      # S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      # S3_SECRET_KEY: ${S3_SECRET_KEY}
      RATE_LIMIT_ENABLED: "true"
      # MUST stay below the postgres service's max_connections (30). The code
      # default is 40, which would exhaust it — and with no DATABASE_READ_URL the
      # read pool is a clone of this one, so 16 is the whole application.
      DB_MAX_CONNECTIONS: "16"
      # One proxy (nginx) sits in front. Leave this at 0 and per-IP rate limiting
      # keys on nginx's address, so every client shares one bucket.
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      # Written at runtime by admin upload. A named volume is seeded from the
      # image only at creation and SHADOWS it afterwards, so themes/default/
      # freezes while unmounted static/ keeps updating — that split once shipped
      # a broken mobile sidebar. docker-entrypoint.sh re-copies it every start.
      - plugins:/app/plugins
      - themes:/app/frontend/themes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # With MinIO: wait on minio-init rather than minio — the app never creates
      # a bucket, so starting once MinIO is merely *healthy* races its creation.
      # minio-init: { condition: service_completed_successfully }
    healthcheck:
      # /health/ready, not /health: this decides whether the container is usable,
      # and /health answers 200 as long as the process is alive.
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # ─── Memory limits ──────────────────────────────────────────────────────
    # Every service carries one, else a leak anywhere takes the 4 GB host down
    # and the OOM killer picks Postgres — the only process holding data that
    # cannot be rebuilt. The four total 2.2 GB (768m + 1g + 192m + 256m); the
    # rest is page cache, not slack, and keeps reads off the disk.
    deploy:
      resources:
        limits:
          memory: 768m

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: forum
    # The image's defaults target a machine that is not this one. Sized against
    # the 1 GB limit below, not against the host's 4 GB.
    #
    # Sized against the 1 GB limit below, not the host's 4 GB. max_connections=30
    # sits above the app's DB_MAX_CONNECTIONS=16 (set above — the code default of
    # 40 would exhaust it), leaving room for psql and pg_dump. Raising it is not
    # free: every backend costs memory whether or not it is in use.
    #
    # random_page_cost is the one to notice: the 4.0 default encodes a spinning
    # disk and pushes the planner off index scans — backwards on pd-balanced, and
    # it degrades silently as tables grow.
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    # maxmemory bounds what is otherwise unbounded growth. Everything Redis
    # holds here is reconstructible — site config, resolved user roles, rate
    # limit counters — so evicting the coldest key under pressure is the right
    # failure mode. Without the policy, Redis answers writes with an error once
    # it hits the cap instead, which surfaces as failed requests.
    #
    # Keep it below the container limit: the cap counts stored data, not the
    # allocator overhead and fragmentation on top of it.
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192m

  # No object-store service runs by default: uploads go to Cloudflare R2, which
  # is external. The bucket must serve anonymous reads — upload URLs are written
  # into users.avatar_url, site_config and stored post HTML, and the browser
  # fetches them directly, so no request reaches the app and stored HTML cannot
  # be re-signed at render time. Bind a custom domain to the bucket and point
  # R2_PUBLIC_BASE_URL at it; /health/ready reports "uploads": "readable" once
  # that works.
  #
  # The self-hosted alternative, kept for a deployment that wants no external
  # dependency. To use it: uncomment both services, the `miniodata` volume, the
  # `minio-init` line under app.depends_on, the four S3_* variables under
  # app.environment, and rebuild the image with `--features s3` instead of `r2`.
  # Budget 384m for it — the memory-limit comment on `app` counts four services.
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
  #   volumes:
  #     - miniodata:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 384m
  #
  # One-shot: create the bucket and make it anonymously readable, for the same
  # reason R2's bucket must be — the browser fetches upload URLs directly.
  #
  # minio-init:
  #   image: minio/mc:latest
  #   depends_on:
  #     minio: { condition: service_healthy }
  #   environment:
  #     S3_BUCKET: ${S3_BUCKET:-forum-uploads}
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
  #     mc mb --ignore-existing local/$${S3_BUCKET} &&
  #     mc anonymous set download local/$${S3_BUCKET}
  #     "
  #   restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Cloudflare Origin Certificate, placed by hand once — it is valid for 15
      # years, so there is no renewal process to automate. certbot-* are kept
      # mounted for the grey-cloud (DNS-only) case, where ACME works again.
      - ./certs:/etc/nginx/certs:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    # The guest micro-cache lives in RAM, not on disk. Entries are valid for 30s
    # (pages) and 7d (CAS blobs, whose keys are immutable), so nothing here is
    # worth surviving a restart — and pd-balanced IOPS are better spent on
    # Postgres. Sized to sit inside the container limit alongside nginx itself.
    tmpfs:
      - /var/cache/nginx:size=192m
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  redisdata:
  # miniodata:
  plugins:
  themes:
  certbot-conf:
  certbot-www:
