# ─── sccache (opt-in; not configuration this repo disables) ───────────────────
# Caches compiled artifacts across `cargo clean`, so a wipe-and-rebuild replays
# from cache instead of recompiling. Worth it here because the dependency tree
# is 393 crates.
#
# Left commented deliberately rather than enabled: naming a `rustc-wrapper` that
# is not installed makes EVERY cargo command in this workspace fail immediately,
# which would break a fresh clone for anyone who has not run the install first.
# So the order matters — install, then uncomment:
#
#   winget install Mozilla.sccache     # or: cargo install sccache
#
# [build]
# rustc-wrapper = "sccache"

# ─── Timezone ─────────────────────────────────────────────────────────────────
# Pins the process timezone to UTC for everything cargo launches — `cargo run`,
# `cargo test`, build scripts.
#
# This codebase deliberately never reads the ambient zone (there is no
# `Local::now()` anywhere, and a CI grep enforces that), so this is a belt to the
# existing braces rather than the thing correctness rests on. It matters for two
# reasons: a dependency that *does* consult the ambient zone cannot make the
# suite behave differently on a developer's machine than in CI, and a test that
# accidentally starts depending on local time fails the same way everywhere
# instead of only for whoever is not on UTC.
#
# NOT `force = true`, on purpose. Cargo's `[env]` only applies when the variable
# is absent from the environment, so `TZ=Asia/Kathmandu cargo test` still
# overrides it — which is exactly what the non-UTC CI job does. Forcing it here
# would make that job silently test UTC and pass for the wrong reason.
[env]
TZ = "UTC"

# ─── Fast linker ─────────────────────────────────────────────────────────────
# rust-lld ships with every rustup toolchain (≥ 1.70) — no extra install needed.
# It replaces the default MSVC link.exe for the link step, which is typically
# the longest single phase in a large Rust build.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# On Linux, use mold (fastest) if available, otherwise lld.
# Install: apt install mold  OR  apt install lld
# Comment out if neither is installed on the build machine.
#
# This is a HARD REQUIREMENT of the container build, not a local optimisation:
# the Dockerfile installs clang and mold specifically because these two lines
# pin them, and the link step fails outright on an image without them.
#
# `rustflags` HERE IS DEAD IN CI. Cargo takes rustflags from exactly one source,
# and a `RUSTFLAGS` environment variable outranks every `target.*.rustflags` in
# a config file — .github/workflows/ci.yml sets one at workflow level, so this
# array is ignored for the whole run. The `linker` key above is a separate
# setting and is unaffected, which is why CI still links with clang. Anything
# added to this array must be added to the workflow's RUSTFLAGS too, or it will
# apply locally and nowhere else.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
