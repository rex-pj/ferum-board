[workspace]
members = [
    "crates/ferum-domain",
    "crates/ferum-application",
    "crates/ferum-infrastructure",
    "crates/ferum-web",
    "migration",
]
resolver = "2"
default-members = ["crates/ferum-web"]

[profile.dev]
debug = "line-tables-only"
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
