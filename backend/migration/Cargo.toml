[package]
name = "migration"
version = "0.1.0"
edition = "2021"

# DDL only, no `#[cfg(test)]` modules — migrations are exercised for real by
# `tests/infrastructure`, which runs `Migrator::up` against a live database.
[lib]
name = "migration"
path = "src/lib.rs"
test = false

# The standalone migration CLI. Gated behind `required-features` so that
# building it is the only thing that drags `sea-orm-cli` + `clap` into the tree.
# `ferum-web` and `ferum-infrastructure` depend on this crate as a LIBRARY only
# (Migrator::up at startup, PLUGIN_DB_ROLE), so their builds no longer pay for a
# CLI argument parser they never invoke.
#   Run it with:  cargo run -p migration --features cli -- up
[[bin]]
name = "migration"
path = "src/main.rs"
required-features = ["cli"]
test = false

[features]
default = []
cli = ["sea-orm-migration/cli"]

[dependencies]
sea-orm-migration = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
