[package]
name = "ferum-infrastructure"
version = "0.1.0"
edition = "2021"

[features]
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
meilisearch = ["dep:meilisearch-sdk"]
script_plugins = ["dep:boa_engine"]
default = []

[dependencies]
ferum-domain = { path = "../ferum-domain" }
ferum-application = { path = "../ferum-application" }

async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
hex = "0.4"
hmac = "0.12"
ammonia = "4"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }

aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
meilisearch-sdk = { version = "0.28", optional = true }
boa_engine = { version = "0.19", optional = true }
anyhow = "1.0.102"
zip = "2.1"
toml = "0.8"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
intl-memoizer = "0.5.3"

