[package]
name = "ferum-application"
version = "0.1.0"
edition = "2021"

[dependencies]
ferum-domain = { path = "../ferum-domain" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.19", features = ["derive"] }
pulldown-cmark = { version = "0.13", features = ["html"] }
ammonia = "4"
regex = "1"
bytes = "1"
mime = "0.3"
tokio = "1.52.3"
hex = "0.4.3"
sha2 = "0.11.0"
