[package]
name = "ferum-application"
version = "0.1.0"
edition = "2021"

[dependencies]
ferum-domain = { path = "../ferum-domain" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
pulldown-cmark = { version = "0.13", features = ["html"] }
ammonia = "4"
regex = "1"
bytes = "1"
tokio = "1.52.3"
futures = "0.3"
hex = "0.4.3"
sha2 = "0.11.0"
dashmap = "6"
