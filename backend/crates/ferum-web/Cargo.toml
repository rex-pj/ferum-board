[package]
name = "ferum-web"
version = "0.1.0"
edition = "2021"

# Tests live in `tests/web` — see the note in ferum-domain/Cargo.toml. `doctest`
# is deliberately left ON here: `telemetry::Latency` carries a real compiled
# ```rust example, and it is the only doctest in the workspace.
[lib]
name = "ferum_web"
path = "src/lib.rs"
test = false

# `main.rs` is a thin entry point with no tests of its own; without this cargo
# links a second empty harness for the binary target on every `cargo test`.
[[bin]]
name = "ferum-board"
path = "src/main.rs"
test = false

[features]
s3 = ["ferum-infrastructure/s3"]
gcs = ["ferum-infrastructure/gcs"]
meilisearch = ["ferum-infrastructure/meilisearch"]
script_plugins = ["ferum-infrastructure/script_plugins"]
bulk_seed = ["ferum-infrastructure/bulk_seed"]
default = ["script_plugins", "bulk_seed"]

[dependencies]
# `axum` feature = `IntoResponse for AppError`, which every handler returning
# `Result<_, AppError>` needs; `sea-orm` = `From<DbErr>`, used by the handlers
# that query the connection directly (e.g. api/uploads.rs).
ferum-domain = { path = "../ferum-domain", features = ["axum", "sea-orm"] }
ferum-application = { path = "../ferum-application" }
# `default-features = false` is load-bearing, not tidiness: this crate's own
# `bulk_seed` feature is what forwards to `ferum-infrastructure/bulk_seed`. Left
# taking infrastructure's defaults, that crate would switch the dataset back on
# by itself and `cargo build --no-default-features` here would appear to work
# while changing nothing.
ferum-infrastructure = { path = "../ferum-infrastructure", default-features = false }
migration = { path = "../../migration" }

anyhow = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart"] }
bytes = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
# Body::Limited, used by middleware/body_limit.rs to cap non-upload request
# bodies. Already in the tree as an axum dependency; declared here because we
# name the type directly.
http-body-util = { workspace = true }
rust_decimal = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
] }
tokio-stream = { workspace = true }
tower = { workspace = true }
# `compression-gzip` + `compression-br` back the `CompressionLayer` in
# `routings/mod.rs`. Deflate and zstd are deliberately left out: every browser
# that sends `deflate` also sends gzip, and zstd support is still narrow enough
# that compiling a third encoder buys nothing a client would choose.
tower-http = { workspace = true, features = [
    "cors",
    "trace",
    "request-id",
    "fs",
    "set-header",
    "limit",
    "compression-gzip",
    "compression-br",
] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
# Query strings are assembled server-side for pagination/tab links; a raw
# `&q={query}` breaks the moment someone searches for a term containing `&`.
urlencoding = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
zip = { workspace = true }

# Drop-in high-concurrency allocator for the production (Linux/macOS) build. Reduces
# malloc contention and long-uptime fragmentation under heavy async load. Falls back
# to the system allocator on MSVC (Windows dev), so behaviour there is unchanged.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
