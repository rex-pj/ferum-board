[package]
name = "ferum-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ferum-board"
path = "src/main.rs"

[features]
s3 = ["ferum-infrastructure/s3"]
meilisearch = ["ferum-infrastructure/meilisearch"]
script_plugins = ["ferum-infrastructure/script_plugins"]
default = ["script_plugins"]

[dependencies]
ferum-domain = { path = "../ferum-domain" }
ferum-application = { path = "../ferum-application" }
ferum-infrastructure = { path = "../ferum-infrastructure" }
migration = { path = "../../migration" }

anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dotenvy = "0.15"
mime = "0.3"
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.19", features = ["derive"] }
tokio-stream = "0.1.18"
