[package]
name = "ferum-test-support"
version = "0.1.0"
edition = "2021"
publish = false

# Test-harness crate: no public API to document, and no ```rust doc examples.
# Skips a rustdoc invocation per crate on every `cargo test`.
[lib]
doctest = false

[dependencies]
ferum-domain = { path = "../../crates/ferum-domain" }
ferum-application = { path = "../../crates/ferum-application" }
bytes = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
mockall = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
