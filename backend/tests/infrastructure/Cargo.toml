[package]
name = "ferum-infrastructure-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Test-harness crate: no public API to document, and no ```rust doc examples.
# Skips a rustdoc invocation per crate on every `cargo test`.
[lib]
doctest = false

[features]
# Forward to each adapter's own opt-in feature, so `storage/{gcs,s3,r2}.rs`
# compile only when the type under test exists.
gcs = ["ferum-infrastructure/gcs"]
s3 = ["ferum-infrastructure/s3"]
r2 = ["ferum-infrastructure/r2"]

[dependencies]
ferum-domain = { path = "../../crates/ferum-domain" }
ferum-application = { path = "../../crates/ferum-application" }
ferum-infrastructure = { path = "../../crates/ferum-infrastructure" }
# `RecordingEmailService`, for the mail-provider precedence tests. Shared with the
# application suite rather than duplicated here.
ferum-test-support = { path = "../support" }
migration = { path = "../../migration" }

async-trait = { workspace = true }
bcrypt = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
zip = { workspace = true }
# Builds the image fixtures the pipeline tests feed in, and re-decodes the
# output to assert on dimensions. Encoding a real PNG/JPEG here rather than
# checking in binary blobs keeps the "what went in" visible in the test.
image = { workspace = true }
# For `StatusCode` only — the Resend adapter's error mapping takes one, and no
# request is ever made.
reqwest = { workspace = true }
sea-orm = { workspace = true }
# `net` + `io-util`: the public-read probe test answers a real HTTP request from
# a raw TcpListener rather than mocking a status code.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde_json = { workspace = true }
uuid = { workspace = true }
