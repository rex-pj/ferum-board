[package]
name = "ferum-web-tests"
version = "0.1.0"
edition = "2021"

# Test-harness crate: no public API to document, and no ```rust doc examples.
# Skips a rustdoc invocation per crate on every `cargo test`.
[lib]
doctest = false

[features]
script_plugins = ["ferum-web/script_plugins"]
default = ["script_plugins"]

[dependencies]
ferum-web = { path = "../../crates/ferum-web" }
ferum-domain = { path = "../../crates/ferum-domain", features = ["axum"] }
ferum-application = { path = "../../crates/ferum-application" }
ferum-infrastructure = { path = "../../crates/ferum-infrastructure" }

# `anyhow` for `build_tera`'s Result, `async-trait` for the stub `Translator`
# implementations the tera_engine tests render against.
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros"] }
# The datetime wire-format tests assert on concrete instants, which needs the
# same chrono the request/response types are built from.
chrono = { workspace = true }
# The date-filter tests name zones (`Asia/Kathmandu`, `America/New_York`)
# directly, which is the whole point of them.
chrono-tz = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }
validator = { workspace = true }
uuid = { workspace = true }
tera = { workspace = true }
