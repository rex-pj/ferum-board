[package]
name = "ferum-web-tests"
version = "0.1.0"
edition = "2021"

[features]
script_plugins = ["ferum-web/script_plugins"]
default = ["script_plugins"]

[dependencies]
ferum-web = { path = "../../crates/ferum-web" }
ferum-domain = { path = "../../crates/ferum-domain" }

axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
http-body-util = "0.1"
bytes = "1"
validator = { version = "0.19", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
