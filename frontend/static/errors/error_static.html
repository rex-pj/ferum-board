<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something Went Wrong</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; max-width: 480px; padding: 2rem; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: .75rem; }
    p { color: #8d96a0; margin-bottom: 1.5rem; }
    a { color: #4493f8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⚠</div>
    <h1>Something Went Wrong</h1>
    <p>An unexpected error occurred. Please try again or return to the home page.</p>
    <a href="/">Go home</a>
  </div>
</body>
</html>
