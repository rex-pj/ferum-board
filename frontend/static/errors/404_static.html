<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; max-width: 480px; padding: 2rem; }
    .code { font-size: 6rem; font-weight: 700; color: #3d444d; line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: .75rem; }
    p { color: #8d96a0; margin-bottom: 1.5rem; }
    a { color: #4493f8; text-decoration: none; margin: 0 .75rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Go home</a>
    <a href="/search">Search</a>
  </div>
</body>
</html>
