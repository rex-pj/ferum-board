<!DOCTYPE html>
<html lang="en" data-bs-theme="{{ theme_bs_theme | default(value='auto') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>

  <script src="/static/js/ferum-preload.js"></script>

  <link rel="icon" href="{% if site.favicon_url %}{{ site.favicon_url }}{% else %}/static/favicon.svg{% endif %}">
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/fontawesome/all.min.css">
  <link rel="stylesheet" href="/themes/default/assets/theme.css">
  {% if active_theme and active_theme != "default" %}
  <link rel="stylesheet" href="/themes/{{ active_theme }}/assets/theme.css">
  {% endif %}

  {% if site.primary_color %}
  <style>
    :root,[data-bs-theme="light"],[data-bs-theme="dark"]{
      --ferum-primary:{{ site.primary_color }};
      --bs-primary:{{ site.primary_color }};
      {% if site.primary_color_rgb %}--bs-primary-rgb:{{ site.primary_color_rgb }};--bs-link-color-rgb:{{ site.primary_color_rgb }};{% endif %}
      --bs-link-color:{{ site.primary_color }};
    }
  </style>
  {% endif %}
</head>
<body>

  {# Minimal header — site name only, no nav categories, no auth state #}
  <header class="border-bottom mb-5">
    <div class="container py-3">
      <a href="/" class="text-decoration-none text-body fw-semibold">
        {% if site.logo_url %}
          <img src="{{ site.logo_url }}" alt="{{ site.name }}" height="28" class="me-2">
        {% else %}
          {{ site.name }}
        {% endif %}
      </a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
