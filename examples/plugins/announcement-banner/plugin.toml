[meta]
id          = "com.ferum.announcement-banner"
name        = "Announcement Banner"
version     = "1.0.0"
tier        = "script"
min_ferum   = "0.1.0"
description = "Displays a configurable announcement banner at the top of every public page via a server-injected UI slot."
author      = "Ferum Team"

# ─── Script entry point ───────────────────────────────────────────────────────
# bundle.js registers this plugin's element for the `content_before` slot; the
# exact name is `ui_slot_element_tag(meta.id, "content_before")` — see [ui_slots].
# This file is served at /plugins/com.ferum.announcement-banner/assets/bundle.js

[script]
bundle_file = "bundle.js"

# ─── Config schema ────────────────────────────────────────────────────────────
# The config editor is a raw JSON textarea, NOT a generated form — but these
# titles and descriptions are rendered beneath it as a field reference, so they
# are what an operator actually reads. Write them for that reader.
#
# `default` here is seeded into the plugin's config at install, so the banner has
# a message the moment it is activated.
#
# THE PROPS BELOW ARE A SEPARATE COPY OF THESE VALUES, AND THAT IS THIS PLUGIN'S
# ONE ROUGH EDGE. `[ui_slots.*].props` are baked into the plugin_ui_slots row at
# activation and `resolve_config_template` ({{config.x}}) is applied only to
# webhook URLs, never to props — so editing the config here does NOT change what
# the banner displays until the plugin is deactivated and activated again, which
# rewrites the row from the manifest.
#
# examples/plugins/home-hero shows the way around it: declare no props, expose an
# RPC action that returns `Ferum.config`, and have the element fetch it on
# connect. Config edits then land on the next page load. That pattern is the one
# to copy for anything whose content changes after install; this plugin keeps
# props because it is also the smallest possible demonstration of them.

[config_schema]
type     = "object"
required = ["message"]

[config_schema.properties.message]
type        = "string"
title       = "Banner message"
description = "The announcement text shown at the top of every page. Supports plain text only."
default     = "Welcome to the forum!"

[config_schema.properties.kind]
type        = "string"
title       = "Alert style"
description = "Bootstrap alert variant: info, warning, danger, success, primary, secondary."
default     = "info"

[config_schema.properties.dismissible]
type        = "boolean"
title       = "Allow dismiss"
description = "Whether visitors can close the banner. Dismissed state is saved in sessionStorage."
default     = true

# ─── Capabilities ─────────────────────────────────────────────────────────────
# This plugin runs no server-side hooks — it only injects client-side HTML.

[capabilities]
hooks = []

# ─── UI Slots ──────────────────────────────────────────────────────────────────
# Ferum reads this section at activation time and inserts one row per slot into
# the plugin_ui_slots table. On every page request the server calls
# PluginUiRuntime::active_ui_slots(), builds HTML like:
#   <ferum-slot-com-ferum-announcement-banner-content-before
#       data-message="Welcome to the forum!"
#       data-kind="info"
#       data-dismissible="true">
#   </ferum-slot-com-ferum-announcement-banner-content-before>
# and injects it into the Tera context as plugin_slots.content_before.
#
# The element name is `ui_slot_element_tag(meta.id, <slot name>)`: `ferum-slot-`
# plus the slug plus the slot name, each lowercased with every non-alphanumeric
# run folded to a single `-`. It is not configurable, and bundle.js must spell
# the same string — it is the `TAG` constant there.
#
# THE SLUG IS IN THE NAME so that several plugins can occupy one slot. Named
# after the slot alone, two plugins in `content_before` would both define the
# same element: the server emits one tag per slot ROW, so the plugin that
# registered first would render into BOTH of them and the other into neither,
# with nothing logged. Widgets sharing a slot render in `load_order` order.
#
# `component` — path at which bundle.js is served (relative to APP_URL).
# `props`     — static HTML attribute strings added to the element at activation
#               time. NOT re-resolved from config: see the config_schema note
#               above for why these values and the defaults up there are two
#               copies, and what to do instead in a plugin whose content changes.

[ui_slots.content_before]
component = "/plugins/com.ferum.announcement-banner/assets/bundle.js"
props = [
    'data-message="Welcome to the forum!"',
    'data-kind="info"',
    'data-dismissible="true"',
]
