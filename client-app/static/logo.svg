<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36">
  <style>
    .logo-accent { fill: #6366f1; }
    .logo-body   { fill: #111827; }
    @media (prefers-color-scheme: dark) {
      .logo-accent { fill: #818cf8; }
      .logo-body   { fill: #e2e8f0; }
    }
  </style>
  <text x="0" y="28"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="800" letter-spacing="-1"
        class="logo-accent">Fe</text>
  <text x="36" y="28"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="800" letter-spacing="-1"
        class="logo-body">rum</text>
  <text x="102" y="28"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400"
        class="logo-accent">board</text>
</svg>
