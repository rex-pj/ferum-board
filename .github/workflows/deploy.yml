name: Deploy

# Only after CI passes on main. `workflow_run` rather than `needs:` because CI
# also runs on pull_request, where deploying would be wrong.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Manual re-deploy without a new commit (rollback, config change on the VM).
  workflow_dispatch:

env:
  GCP_PROJECT: project-b046f30f-3ee9-4a82-a84
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  VM_NAME: instance-20260810-133643
  REPOSITORY: ferum
  IMAGE_NAME: ferum-board

jobs:
  deploy:
    # A failed CI run still fires workflow_run; only a successful one may deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required by Workload Identity Federation: the job mints a short-lived
      # OIDC token instead of holding a service-account key in secrets.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, not the commit
          # that triggered CI. Pin it so the image matches what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repository ROOT, not backend/: the runtime stage copies frontend/
          # and locales/ as well as the binary.
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            FEATURES=s3
          # Two tags: the SHA is what the VM actually pulls (immutable, so a
          # rollback is just re-running this workflow at an older commit), and
          # `latest` is a convenience pointer for manual work on the box.
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          # Helps the apt and runtime layers only. The cargo build layer is
          # invalidated by any change under backend/, so expect a full compile
          # every deploy until the Dockerfile uses cargo-chef.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="set -euo pipefail
              cd /opt/ferum
              export IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}
              docker compose --env-file .env.prod -f docker-compose.prod.yml pull app
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d app
              docker image prune -f"

      - name: Wait for the app to report ready
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="for i in \$(seq 1 30); do
                if curl -fsS http://localhost:5173/health/ready >/dev/null 2>&1; then
                  echo 'ready'; exit 0
                fi
                sleep 5
              done
              echo 'did not become ready'; docker compose -f /opt/ferum/docker-compose.prod.yml logs --tail=50 app; exit 1"
