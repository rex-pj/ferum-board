name: CI

# Deploy lives in this file, as a job gated on the test matrix, rather than in a
# separate workflow keyed on `workflow_run`. It was the latter, and it never once
# fired: GitHub only triggers `workflow_run` (and only offers `workflow_dispatch`)
# for a workflow file that exists on the DEFAULT branch, which here is `main` —
# and `main` carries no workflows at all. A `push` event, by contrast, runs the
# file from the branch that was pushed, so keeping deploy here means it works from
# `develop` without anything having to land on `main` first.
#
# The reason deploy was split out originally still holds and is handled by the
# `if:` on that job: CI also runs on `pull_request`, where deploying would be
# wrong. A PR does not raise a `push` event on `develop`, so the guard is exact.
on:
  push:
    branches: [develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on warnings everywhere, not just the clippy job.
  #
  # The link-arg belongs here rather than in backend/.cargo/config.toml because
  # setting RUSTFLAGS at all makes cargo IGNORE `target.<triple>.rustflags`
  # outright — the sources are first-match, not merged. The config file's
  # `-fuse-ld=mold` is therefore dead in CI, and the linker step below would be
  # installing a linker nothing invokes. `linker = "clang"` is a separate config
  # key and is unaffected, so it still comes from the file.
  RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"

jobs:
  # ─── Test suite, run twice under different timezones ────────────────────────
  #
  # The matrix is the point of this job, not incidental. The suite used to run
  # only on developer machines, where everyone happened to share one zone, so a
  # date bug that depended on the ambient TZ could not be observed. `backend/
  # .cargo/config.toml` sets TZ=UTC as a non-forced default; the `tz` value here
  # is exported into the environment, which takes precedence over it.
  #
  # Asia/Kathmandu is the second leg for a purely technical reason, not because
  # of where anyone deploys: it is UTC+05:45, so its offset is not a whole number
  # of hours. That breaks code which truncates instead of converting — a class of
  # bug a whole-hour zone lets through. No DST, so the leg is also deterministic
  # year-round.
  test:
    name: test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs must report. Cancelling the sibling on first failure hides
      # whether a failure is timezone-dependent, which is the one thing this
      # matrix exists to tell us.
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Kathmandu]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forum
          POSTGRES_PASSWORD: forum
          POSTGRES_DB: forum_test
        ports:
          - 5432:5432
        # The suite provisions throwaway databases from a template, so it needs
        # a server that is actually accepting connections before the first test.
        options: >-
          --health-cmd "pg_isready -U forum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TZ: ${{ matrix.tz }}
      # tests/infrastructure/src/common.rs refuses to run against a non-local
      # host, so this must stay localhost — the service port is mapped onto it.
      TEST_DATABASE_URL: postgresql://forum:forum@localhost:5432/forum_test
      DATABASE_URL: postgresql://forum:forum@localhost:5432/forum_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # backend/.cargo/config.toml pins the Linux linker to clang; the workflow
      # RUSTFLAGS above supplies `-fuse-ld=mold`. Without these the link step
      # fails outright, so they are a build requirement here rather than an
      # optimisation.
      - name: Install linker toolchain (clang + mold)
        run: sudo apt-get update && sudo apt-get install -y clang mold

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # Two matrix legs share a target dir otherwise; the TZ does not change
          # the artifacts, but keying them apart avoids cross-leg cache races.
          key: ${{ matrix.tz }}

      - name: Confirm the timezone actually took effect
        # Cheap, but it is the assumption the whole matrix rests on. If TZ were
        # silently ignored, both legs would pass identically and prove nothing.
        run: |
          echo "TZ env var : $TZ"
          echo "date says  : $(date)"
          echo "UTC is     : $(date -u)"

      - name: Test
        working-directory: backend
        # --workspace is MANDATORY. `default-members` is set to ferum-web, so a
        # bare `cargo test` runs that crate's single unit test and reports "ok"
        # while running none of the real suites. See CLAUDE.md.
        run: cargo test --workspace

  # ─── Lints ──────────────────────────────────────────────────────────────────
  # Split from `test` so it runs once rather than per-timezone: clippy output
  # does not depend on TZ, and linting twice only slows the pipeline.
  lint:
    name: clippy + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install linker toolchain (clang + mold)
        run: sudo apt-get update && sudo apt-get install -y clang mold

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: lint

      - name: Clippy
        working-directory: backend
        # Same --workspace trap as above: without it this lints one crate and
        # exits 0. That is how ~60 warnings once accumulated unnoticed.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
        env:
          # Drop the workflow RUSTFLAGS for this step only. `-D warnings` would
          # otherwise apply to cargo-machete and its whole dependency tree, so a
          # new lint in a floating `stable` toolchain could fail this job over
          # warnings in third-party code this repo does not own.
          RUSTFLAGS: ""

      - name: Unused dependencies
        working-directory: backend
        run: cargo machete

  # ─── Deploy to the GCE VM ───────────────────────────────────────────────────
  # Runs only for a push to `develop` that passed BOTH jobs above. `needs` waits
  # for every leg of the test matrix, and `fail-fast: false` does not weaken that
  # — a failed leg leaves the dependency unsatisfied and this job is skipped.
  #
  # There is no `workflow_dispatch` for a manual re-deploy: it would require this
  # file on the default branch, which is the exact dependency this arrangement
  # removes. Rollback is documented in docs/deployment.md and is a better path
  # anyway — images are tagged by commit SHA, so redeploying an old one is one
  # `docker compose up` on the box.
  deploy:
    name: deploy (develop → GCE)
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required by Workload Identity Federation: the job mints a short-lived
      # OIDC token instead of holding a service-account key in secrets.
      id-token: write

    env:
      GCP_PROJECT: project-b046f30f-3ee9-4a82-a84
      GCP_REGION: us-central1
      GCP_ZONE: us-central1-a
      VM_NAME: instance-20260810-133643
      REPOSITORY: ferum
      IMAGE_NAME: ferum-board

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repository ROOT, not backend/: the runtime stage copies frontend/
          # and locales/ as well as the binary.
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            FEATURES=s3
          # Two tags: the SHA is what the VM actually pulls (immutable, so a
          # rollback is just re-deploying an older tag), and `latest` is a
          # convenience pointer for manual work on the box.
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          # Helps the apt and runtime layers only. The cargo build layer is
          # invalidated by any change under backend/, so expect a full compile
          # every deploy until the Dockerfile uses cargo-chef.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="set -euo pipefail
              cd /opt/ferum
              export IMAGE_TAG=${{ github.sha }}
              docker compose --env-file .env.prod -f docker-compose.prod.yml pull app
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d app
              docker image prune -f"

      - name: Wait for the app to report ready
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="for i in \$(seq 1 30); do
                if curl -fsS http://localhost:5173/health/ready >/dev/null 2>&1; then
                  echo 'ready'; exit 0
                fi
                sleep 5
              done
              echo 'did not become ready'; docker compose -f /opt/ferum/docker-compose.prod.yml logs --tail=50 app; exit 1"
